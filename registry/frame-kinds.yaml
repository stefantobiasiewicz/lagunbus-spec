# Rodzaje wiadomości — pole RODZAJ identyfikatora ramki (4 bity).
# ŹRÓDŁO PRAWDY. Odpowiednik tabeli w 05-mapowanie-can.md §2.
#
# Numer JEST priorytetem: w CAN wygrywa arbitraż ramka o niższym identyfikatorze,
# a RODZAJ siedzi na najstarszych bitach. Kolejności nie wolno zmieniać bez
# przemyślenia skutków dla arbitrażu.

version: 1
changed: 2026-09-11

kinds:
