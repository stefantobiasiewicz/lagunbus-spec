    transactional: false
  - range: "0x2"
    name: rezerwa wysoka
    description: >
      Zostawiona celowo na sterowanie z węzła wymagające wysokiego priorytetu.
      Jedyne wolne miejsce POWYŻEJ raportu; wartości 0xD-0xE leżą poniżej.

